<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2fa86b">
  <meta name="robots" content="noindex">
  <title>家長蓋章｜汪汪小精靈 學習小伙伴</title>
  <style>
    :root { --bg: #fffaf4; --card: #fff; --line: #f0d9c4; --text: #4a3b32; --muted: #7d6e62; --green: #2fa86b; --green-d: #1f7a4f; --green-l: #e3f6ea; --gold-l: #fff6d6; --red: #c8372f; --orange: #d96a1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
    .note { color: var(--muted); font-size: 0.92rem; margin: 6px 0 0; }
    ul { margin: 6px 0 0; padding-left: 22px; }
    li { margin: 4px 0; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .stat { background: var(--gold-l); border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: 0.95rem; }
    button { width: 100%; min-height: 54px; border: none; border-radius: 16px; background: var(--green); color: #fff; font-family: inherit; font-size: 1.15rem; font-weight: 800; cursor: pointer; }
    button:focus-visible { outline: 3px solid #3d8fd6; outline-offset: 3px; }
    .code { font-size: 2.8rem; font-weight: 800; letter-spacing: 0.18em; text-align: center; color: var(--green-d); background: var(--green-l); border-radius: 16px; padding: 12px 6px; margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
    .warn { color: var(--red); font-weight: 700; }
    .ok { color: var(--green-d); font-weight: 800; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>🐶 學習小伙伴｜家長蓋章</h1>
    <div id="view"></div>
    <p class="note">這一頁不會把任何資料傳到網路上：孩子今天的紀錄是直接寫在 QR Code 裡的，配對用的鑰匙只存在這支手機。</p>
  </main>

  <script src="./stamp.js"></script>
  <script>
  (function () {
    'use strict';
    var KEYS = 'puppy_parent_keys';
    var view = document.getElementById('view');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function loadKeys() {
      try { return JSON.parse(localStorage.getItem(KEYS)) || {}; } catch (e) { return {}; }
    }
    function saveKeys(k) {
      try { localStorage.setItem(KEYS, JSON.stringify(k)); return true; } catch (e) { return false; }
    }
    function today() {
      var d = new Date();
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function show(html) { view.innerHTML = html; }

    function intro() {
      show('<div class="card"><h2>請用孩子裝置上的 QR Code 開啟這一頁</h2>' +
        '<p>在孩子的《學習小伙伴》「自我打卡」頁面，按「配對家長的手機」或「請家長蓋章」，再用這支手機的相機掃畫面上的 QR Code。</p></div>');
    }

    function pair(arg) {
      var parts = arg.split('.');
      var key = parts[0], dev = parts[1];
      if (!/^[0-9a-f]{32}$/.test(key || '') || !/^[0-9a-f]{6}$/.test(dev || '')) return bad();
      var keys = loadKeys();
      keys[dev] = { key: key, paired: today() };
      if (!saveKeys(keys)) {
        show('<div class="card"><h2 class="warn">這支手機沒辦法儲存配對資料</h2><p>請不要用「無痕／私密瀏覽」模式，改用一般模式再掃一次。</p></div>');
        return;
      }
      // 把鑰匙從網址列拿掉，避免留在瀏覽紀錄裡
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* 忽略 */ }
      show('<div class="card"><h2 class="ok">✅ 配對完成</h2>' +
        '<p>請把下面的 6 位數配對碼，打在孩子的裝置上：</p>' +
        '<div class="code" aria-label="配對碼">' + window.PuppyStamp.pairCode(key, dev) + '</div>' +
        '<p class="note">以後孩子完成打卡，請用<strong>這支手機、同一個瀏覽器</strong>掃「請家長蓋章」的 QR Code。清除瀏覽器資料或換手機，就要重新配對。</p></div>');
    }

    function stamp(arg) {
      var parts = arg.split('.');
      if (parts.length !== 4) return bad();
      var dev = parts[0], day = parts[1], nonce = parts[2], payload = parts[3];
      var rec = loadKeys()[dev];
      if (!rec || !rec.key) {
        show('<div class="card"><h2 class="warn">這支手機還沒有和孩子的裝置配對</h2>' +
          '<p>請先在孩子的「自我打卡」頁面按「配對家長的手機」，用這支手機掃配對的 QR Code。</p>' +
          '<p class="note">如果之前配對過，可能是換了瀏覽器、用了無痕模式，或清除過瀏覽器資料。</p></div>');
        return;
      }
      var info;
      try { info = JSON.parse(window.PuppyStamp.b64uDecode(payload)); } catch (e) { return bad(); }
      var items = Array.isArray(info.h) ? info.h : [];
      var html = '<div class="card"><h2>' + esc(day) + ' 孩子說今天做到了：</h2>';
      if (day !== today()) html += '<p class="warn">注意：這張 QR Code 的日期（' + esc(day) + '）不是今天（' + today() + '）。請孩子重新顯示今天的 QR Code。</p>';
      html += items.length ? '<ul>' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p>（沒有打卡項目）</p>';
      html += '<div class="stats"><span class="stat">✨ 今天經驗值 ' + (parseInt(info.x, 10) || 0) + '</span>' +
        '<span class="stat">🦉 英語 ' + (parseInt(info.l, 10) || 0) + ' 次</span>' +
        '<span class="stat">🔥 連續 ' + (parseInt(info.s, 10) || 0) + ' 天</span></div>' +
        '<p class="note">這些是孩子自己勾選的。請您確認孩子真的做到了，再幫他蓋章。</p></div>' +
        '<div class="card" id="stampBox"><button id="btnStamp" type="button">✅ 我確認了，幫孩子蓋章</button></div>';
      show(html);
      document.getElementById('btnStamp').addEventListener('click', function () {
        var code = window.PuppyStamp.stampCode(rec.key, dev, day, nonce, payload);
        document.getElementById('stampBox').innerHTML = '<h2 class="ok">🔖 蓋章完成</h2><p>請把這 6 位數打在孩子的裝置上：</p>' +
          '<div class="code" aria-label="蓋章碼">' + code + '</div>' +
          '<p class="note">這組數字只對今天、這台裝置有效。</p>';
      });
    }

    function bad() {
      show('<div class="card"><h2 class="warn">這個 QR Code 讀不出來</h2><p>請在孩子的裝置上重新顯示 QR Code，再掃一次。</p></div>');
    }

    function route() {
      var h = location.hash.replace(/^#/, '');
      if (!window.PuppyStamp) return bad();
      if (h.indexOf('p=') === 0) return pair(h.slice(2));
      if (h.indexOf('s=') === 0) return stamp(h.slice(2));
      intro();
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>

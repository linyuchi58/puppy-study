<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學習小伙伴">
  <meta name="theme-color" content="#2fa86b">
  <title>汪汪小精靈 學習小伙伴（平板／網頁版 v3.15.1）</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css?v=20261127-3">
</head>
<body>
  <!-- 頂部狀態列 -->
  <header class="topbar">
    <div class="brand">
      <button type="button" id="btnFullscreen" class="fs-btn" title="全螢幕顯示" aria-label="全螢幕顯示">⛶ 全螢幕</button>
      <span>🐶 學習小伙伴</span>
      <select id="gradeSelect" style="border-radius:10px;border:2px solid var(--line);padding:4px 8px;font-weight:700;background:#fff;color:var(--text);">
        <option value="low">國小低年級</option>
        <option value="mid" selected>國小中高年級</option>
        <option value="jh">國中</option>
        <option value="sh">高中</option>
      </select>
    </div>
    <div class="stats-pills">
      <span class="stat-badge" title="連續學習天數">🔥 <span id="topStreak">0</span> 天</span>
      <span class="stat-badge" title="目前擁有的星星">⭐ <span id="topStars">0</span></span>
      <span class="stat-badge" title="總經驗值">✨ <span id="topXp">0</span> XP</span>
      <span class="stat-badge" title="英語闖關愛心">❤️ <span id="topHearts">5</span>/5</span>
    </div>
  </header>

  <!-- 主版面 -->
  <main class="layout">
    <!-- 左側／上方：寵物陪伴舞台 -->
    <aside class="pet-stage">
      <div id="petBubble" class="pet-bubble">汪！歡迎回來，今天想先學英語還是完成好習慣打卡呢？</div>
      <div class="pet-canvas-wrap" id="petCanvasWrap" title="點我摸摸頭！">
        <canvas id="petCanvas" width="220" height="190"></canvas>
      </div>
      <div class="pet-info-bar">
        <div class="pet-name-row" id="petNameLabel">🐕 威爾斯柯基</div>
        <div class="pet-sub-row" id="petSubLabel">💕 親密度 Lv1 ｜ 拿手：🦉 英語（+25% XP）</div>
      </div>

      <div class="meter-row">
        <div style="display:flex;justify-content:space-between;">
          <span>💕 親密度進度</span>
          <span id="bondMeterText">0 / 30</span>
        </div>
        <div class="bar-track">
          <div id="bondBarFill" class="bar-fill" style="width:10%;background:var(--pink);"></div>
        </div>
      </div>

      <div class="meter-row">
        <div style="display:flex;justify-content:space-between;">
          <span>🍖 飽足與活力</span>
          <span id="hungerMeterText">85%</span>
        </div>
        <div class="bar-track">
          <div id="hungerBarFill" class="bar-fill" style="width:85%;background:var(--orange);"></div>
        </div>
      </div>

      <div class="pet-actions">
        <button class="btn btn-soft" id="btnPetTouch">👋 摸摸牠</button>
        <button class="btn btn-orange" id="btnOpenShop">🥣 餵食商店</button>
        <button class="btn btn-purple" id="btnOpenCard">🪪 寵物卡</button>
        <button class="btn btn-soft" id="btnOpenMood">🌈 心情小站</button>
      </div>

      <!-- 桌面版同款：全畫面走動與互動百寶箱 -->
      <div class="pet-playground-box">
        <div class="playground-title">
          <span>🎾 陪夥伴玩耍＆才藝</span>
          <button class="chip-btn" id="btnTogglePeek" title="讓狗狗乖乖待在右下角或自由走動">👁 自由走動中</button>
        </div>
        <!-- v3.3.0：內容由 app.js 的 renderPlayground() 產生（餵食／玩具要花星星，才藝依親密度解鎖） -->
        <div id="playgroundBody"></div>
      </div>
    </aside>

    <!-- 右側／下方：四大核心功能分頁 -->
    <section id="mainContent">
      <!-- 分頁 1：英語單字闖關 -->
      <div id="tab-english" class="tab-pane"></div>

      <!-- 分頁 2：自我打卡（好習慣與功課） -->
      <div id="tab-checkin" class="tab-pane" style="display:none;"></div>

      <!-- 分頁：打字練習（英打＋注音鍵位＋中文打字＋全班測驗，內容由 typing.js 產生） -->
      <div id="tab-typing" class="tab-pane" style="display:none;"></div>
      <div id="tab-math" class="tab-pane" style="display:none;"></div>
      <!-- v3.14.0：🧩 益智挑戰（魔術方塊，內容由 puzzle.js 產生） -->
      <div id="tab-puzzle" class="tab-pane" style="display:none;"></div>

      <!-- 分頁 3：寵物圖鑑與配件 -->
      <div id="tab-dex" class="tab-pane" style="display:none;"></div>

      <!-- 分頁 4：搬家碼與跨裝置備份 -->
      <div id="tab-transfer" class="tab-pane" style="display:none;"></div>
    </section>
  </main>

  <!-- 瀏覽人次（低調小字，counter.js 產生；不想要時刪掉下面載入 counter.js 那一行即可） -->
  <footer class="site-foot"><span id="visitCount" hidden></span></footer>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav" aria-label="主要功能">
    <button class="nav-tab active" data-tab="english">
      <span class="nav-ico" aria-hidden="true">🦉</span><span class="nav-lbl">英語闖關</span>
    </button>
    <button class="nav-tab" data-tab="checkin">
      <span class="nav-ico" aria-hidden="true">✅</span><span class="nav-lbl">自我打卡</span>
    </button>
    <button class="nav-tab" data-tab="typing">
      <span class="nav-ico" aria-hidden="true">⌨️</span><span class="nav-lbl">打字練習</span>
    </button>
    <button class="nav-tab" data-tab="math">
      <span class="nav-ico" aria-hidden="true">🧮</span><span class="nav-lbl">心算挑戰</span>
    </button>
    <button class="nav-tab" data-tab="puzzle">
      <span class="nav-ico" aria-hidden="true">🧩</span><span class="nav-lbl">益智挑戰</span>
    </button>
    <button class="nav-tab" data-tab="dex">
      <span class="nav-ico" aria-hidden="true">📖</span><span class="nav-lbl">寵物圖鑑</span>
    </button>
    <button class="nav-tab" data-tab="transfer">
      <span class="nav-ico" aria-hidden="true">📦</span><span class="nav-lbl">搬家碼／備份</span>
    </button>
  </nav>

  <!-- 全畫面桌面級走動與物理互動舞台（不擋按鈕點擊） -->
  <canvas id="worldCanvas"></canvas>

  <!-- 通用彈出視窗 -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <script src="./vocab_data.js?v=20261127-3"></script>
  <script src="./vocab_filter.js?v=20261127-3"></script>
  <script src="./qrcode.js?v=20261127-3"></script>
  <script src="./stamp.js?v=20261127-3"></script>
  <script src="./zh_texts.js?v=20261127-3"></script>
  <script src="./typing.js?v=20261127-3"></script>
  <script src="./math.js?v=20261127-3"></script>
  <script src="./puzzle.js?v=20261127-3"></script>
  <script src="./sel.js?v=20261127-3"></script>
  <script src="./wheel.js?v=20261127-3"></script>
  <script src="./pet_engine.js?v=20261127-3"></script>
  <script src="./petplay.js?v=20261127-3"></script>
  <script src="./vip.js?v=20261127-3"></script>
  <script src="./counter.js?v=20261127-3"></script>
  <script src="./cloud_config.js?v=20261127-3"></script>
  <script src="./cloud_merge.js?v=20261127-3"></script>
  <script src="./cloud.js?v=20261127-3"></script>
  <script src="./app.js?v=20261127-3"></script>
</body>
</html>
